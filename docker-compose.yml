# НЕОБЯЗАТЕЛЬНО. По умолчанию scs ходит во внешний инстанс pgvector на 127.0.0.1:5434
# (см. pg в конфиге) — там заведены отдельные роль и БД "scs", изолированные от
# остальных данных инстанса. Этот compose нужен только если своего Postgres нет:
#   docker compose up -d && SCS_PG=postgres://scs:scs@127.0.0.1:5440/scs scs migrate
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: scs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scs
      POSTGRES_PASSWORD: scs
      POSTGRES_DB: scs
    # Только localhost. Индекс содержит исходный код — наружу не выставляем.
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      # PG18+ ожидает монтирование в /var/lib/postgresql, а не в .../data:
      # данные ложатся в версионированный подкаталог ради pg_upgrade --link.
      - scs-pgdata:/var/lib/postgresql
    command:
      - postgres
      # HNSW-индекс должен жить в памяти, иначе поиск деградирует до дисковых чтений.
      - -c
      - shared_buffers=1GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_parallel_maintenance_workers=4
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scs -d scs"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scs-pgdata:
